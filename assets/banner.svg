<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.4" />
    </pattern>

    <!-- Filter for Glow & Shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-6px) translateX(4px); }
      }
      @keyframes dashLine {
        to { stroke-dashoffset: -40; }
      }
      @keyframes barGrow {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.22); }
      }

      .pulse-bg {
        transform-origin: 950px 180px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .float-container {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .dash-anim {
        stroke-dasharray: 6, 6;
        animation: dashLine 4s linear infinite;
      }
      .bar-1 { transform-origin: 1010px 260px; animation: barGrow 4.5s ease-in-out infinite; }
      .bar-2 { transform-origin: 1040px 260px; animation: barGrow 3.8s ease-in-out infinite 0.6s; }
      .bar-3 { transform-origin: 1070px 260px; animation: barGrow 5.2s ease-in-out infinite 1.2s; }
      .bar-4 { transform-origin: 1100px 260px; animation: barGrow 4.1s ease-in-out infinite 0.3s; }
      .bar-5 { transform-origin: 1130px 260px; animation: barGrow 4.8s ease-in-out infinite 0.9s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs -->
  <circle class="pulse-bg" cx="950" cy="180" r="170" fill="url(#glowPulse)" />
  <circle class="pulse-bg" cx="200" cy="90" r="120" fill="url(#glowPulse)" />

  <!-- Background Decorative Dynamic Diagram (Workforce Hierarchy & Forecast Curve) -->
  <g class="float-container" opacity="0.45">
    <!-- Connecting Workforce Hierarchy Lines -->
    <path d="M 880 150 L 960 110 L 1050 110" stroke="#6366f1" stroke-width="2" fill="none" class="dash-anim" />
    <path d="M 960 110 L 960 190 L 1030 190" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-opacity="0.8" />
    <path d="M 960 190 L 960 250 L 1000 250" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-opacity="0.7" />

    <!-- Org Nodes -->
    <g transform="translate(860, 135)">
      <rect width="36" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="18" cy="13" r="4" fill="#38bdf8" />
    </g>
    <g transform="translate(945, 95)">
      <rect width="32" height="24" rx="5" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="16" cy="12" r="3.5" fill="#10b981" />
    </g>
    <g transform="translate(1040, 95)">
      <rect width="32" height="24" rx="5" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="16" cy="12" r="3.5" fill="#f472b6" />
    </g>

    <!-- Forecast Growth Trend Curve -->
    <path d="M 870 270 C 930 250, 990 200, 1060 170 C 1110 148, 1140 130, 1170 115"
          fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />

    <!-- Capacity Planning Animated Histogram Bars -->
    <rect class="bar-1" x="1005" y="195" width="14" height="65" rx="4" fill="#6366f1" fill-opacity="0.7" />
    <rect class="bar-2" x="1035" y="170" width="14" height="90" rx="4" fill="#38bdf8" fill-opacity="0.75" />
    <rect class="bar-3" x="1065" y="150" width="14" height="110" rx="4" fill="#818cf8" fill-opacity="0.8" />
    <rect class="bar-4" x="1095" y="130" width="14" height="130" rx="4" fill="#c084fc" fill-opacity="0.85" />
    <rect class="bar-5" x="1125" y="110" width="14" height="150" rx="4" fill="#10b981" fill-opacity="0.9" />
  </g>

  <!-- Foreground Main Branding & Typography (High Contrast, Never Obscured) -->
  <g filter="url(#textShadow)">
    <!-- Category Badge -->
    <g transform="translate(60, 48)">
      <rect width="310" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">STRATEGIC HEADCOUNT &amp; ORG DESIGN</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="135" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
      Awesome Workforce Planning
    </text>

    <!-- Subtitle -->
    <text x="60" y="180" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="600">
      Headcount Forecasting, Org Design, People Analytics &amp; Scenario Modeling
    </text>

    <!-- Descriptive Line -->
    <text x="60" y="218" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400">
      Curated directory of enterprise SaaS suites, open-source HRMS platforms, and constraint solvers.
    </text>

    <!-- Capability Feature Badges -->
    <g transform="translate(60, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">👥 Headcount Forecasting</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="168" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🏛️ Org Chart Modeling</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(372, 0)">
        <rect width="158" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 People Analytics</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(542, 0)">
        <rect width="168" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💡 Skills Gap Analysis</text>
      </g>
    </g>

    <!-- Bottom Metadata Banner -->
    <g transform="translate(60, 335)">
      <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        Updated October 2026 • Verified Pricing &amp; Limits • Star History &amp; Community Maintained
      </text>
    </g>
  </g>
</svg>
